<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MTS Education - Quản lý tài khoản</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; color: #333; padding: 40px 20px; }
    .container { max-width: 600px; margin: 0 auto; }
    h1 { font-size: 24px; margin-bottom: 8px; }
    p.subtitle { color: #666; margin-bottom: 30px; font-size: 14px; }
    .card { background: white; border-radius: 12px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 20px; }
    .card h3 { margin-bottom: 16px; font-size: 18px; }
    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: 13px; font-weight: 600; color: #555; margin-bottom: 4px; }
    input, select { width: 100%; padding: 10px 14px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; outline: none; }
    input:focus, select:focus { border-color: #333; }
    button { padding: 12px 24px; background: #000; color: #fff; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; width: 100%; }
    button:hover { background: #333; }
    .output { margin-top: 16px; background: #f9f9f9; border: 1px solid #eee; border-radius: 8px; padding: 14px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-break: break-all; max-height: 300px; overflow-y: auto; }
    .note { background: #fffbeb; border: 1px solid #fde68a; border-radius: 8px; padding: 12px 14px; font-size: 13px; color: #92400e; margin-bottom: 20px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎓 MTS Education - Tạo tài khoản học sinh</h1>
    <p class="subtitle">Công cụ tạo dữ liệu tài khoản để thêm vào Firebase Realtime Database</p>

    <div class="note">
      <strong>Hướng dẫn:</strong> Nhập thông tin học sinh → Nhấn "Tạo JSON" → Copy JSON → Paste vào Firebase Console (Realtime Database → users).
    </div>

    <div class="card">
      <h3>Thông tin tài khoản</h3>
      <div class="form-group">
        <label>Tên đăng nhập (username)</label>
        <input type="text" id="username" placeholder="vd: hocsinh01">
      </div>
      <div class="form-group">
        <label>Mật khẩu</label>
        <input type="text" id="password" placeholder="vd: matkhau123">
      </div>
      <div class="form-group">
        <label>Tên hiển thị</label>
        <input type="text" id="displayName" placeholder="vd: Nguyễn Văn A">
      </div>
      <div class="form-group">
        <label>Vai trò</label>
        <select id="role">
          <option value="student">Học sinh (student)</option>
          <option value="admin">Admin</option>
        </select>
      </div>
      <button onclick="generateJSON()">Tạo JSON cho Firebase</button>
      <div class="output" id="output" style="display:none;"></div>
    </div>

    <div class="card">
      <h3>Tạo hàng loạt</h3>
      <div class="form-group">
        <label>Danh sách (mỗi dòng: username,password,displayName)</label>
        <textarea id="bulkInput" rows="6" style="width:100%;padding:10px 14px;border:1px solid #ddd;border-radius:8px;font-size:13px;font-family:monospace;outline:none;resize:vertical;" placeholder="hocsinh01,matkhau123,Nguyễn Văn A
hocsinh02,matkhau456,Trần Thị B
hocsinh03,matkhau789,Lê Văn C"></textarea>
      </div>
      <button onclick="generateBulkJSON()">Tạo JSON hàng loạt</button>
      <div class="output" id="bulkOutput" style="display:none;"></div>
    </div>
  </div>

  <script>
    async function hashPassword(password) {
      const encoder = new TextEncoder();
      const data = encoder.encode(password);
      const hashBuffer = await crypto.subtle.digest('SHA-256', data);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    async function generateJSON() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      const displayName = document.getElementById('displayName').value.trim();
      const role = document.getElementById('role').value;

      if (!username || !password || !displayName) {
        alert('Vui lòng điền đầy đủ thông tin!');
        return;
      }

      const hashedPw = await hashPassword(password);
      const userId = 'user_' + username;

      const userData = {
        [userId]: {
          username: username,
          displayName: displayName,
          password: hashedPw,
          role: role,
          createdAt: new Date().toISOString().split('T')[0],
          results: {}
        }
      };

      const output = document.getElementById('output');
      output.style.display = 'block';
      output.textContent = JSON.stringify(userData, null, 2);
    }

    async function generateBulkJSON() {
      const bulkInput = document.getElementById('bulkInput').value.trim();
      if (!bulkInput) {
        alert('Vui lòng nhập danh sách!');
        return;
      }

      const lines = bulkInput.split('\n').filter(l => l.trim());
      const users = {};

      for (const line of lines) {
        const parts = line.split(',').map(s => s.trim());
        if (parts.length < 3) continue;

        const [username, password, displayName] = parts;
        const hashedPw = await hashPassword(password);
        const userId = 'user_' + username;

        users[userId] = {
          username: username,
          displayName: displayName,
          password: hashedPw,
          role: 'student',
          createdAt: new Date().toISOString().split('T')[0],
          results: {}
        };
      }

      const output = document.getElementById('bulkOutput');
      output.style.display = 'block';
      output.textContent = JSON.stringify(users, null, 2);
    }
  </script>
</body>
</html>
