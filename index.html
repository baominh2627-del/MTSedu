  <body>
    <!-- Nơi React sẽ kết nối và vẽ giao diện vào -->
    <div id="root"></div>
    <script>
      // Chặn click chuột phải
      document.addEventListener('contextmenu', function(e) {
        e.preventDefault();
      });

      // Chặn các phím tắt (F12, Ctrl+U, Ctrl+Shift+I/J/C, Ctrl+S)
      document.onkeydown = function(e) {
        if (e.keyCode === 123) return false;
        if (e.ctrlKey && e.keyCode === 85) return false;
        if (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67)) return false;
        if (e.ctrlKey && e.keyCode === 83) return false;
      };
    </script>
    
    <!-- ANTI-SCREENSHOT PROTECTION WITH PENALTY -->
    <style>
      #mts-anti-screenshot { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.98); color: #fff; z-index: 9999999; justify-content: center; align-items: center; flex-direction: column; font-family: sans-serif; text-align: center; }
    </style>
    <div id="mts-anti-screenshot">
        <span style="font-size: 50px; margin-bottom: 20px;">⚠️</span>
        <b style="font-size: 24px; color: #ff4d4f;">PHÁT HIỆN HÀNH VI ĐÁNG NGỜ</b>
        <p style="font-size: 16px; color: #ccc; margin-top: 10px;">Cảnh báo: Bạn đã cố tình mở công cụ chụp ảnh hoặc chuyển tab khi chưa đăng nhập.<br>Để bảo vệ bản quyền, hệ thống đã khóa màn hình của bạn.</p>
        <p style="font-size: 18px; color: #fff; margin-top: 25px;">Thời gian khóa còn lại: <span id="mts-countdown" style="color: #ff4d4f; font-weight: bold; font-size: 30px;">05:00</span></p>
    </div>
    <script>
        const daDangNhap = false; // Tạm giả lập chưa đăng nhập
        if (!daDangNhap) {
            const protectionOverlay = document.getElementById('mts-anti-screenshot');
            const countdownSpan = document.getElementById('mts-countdown');
            let isLocked = false;
            let countdownInterval;

            window.addEventListener('blur', function() {
                if (isLocked) return; // Đang phạt thì bỏ qua

                isLocked = true;
                protectionOverlay.style.display = 'flex';
                
                let timeLeft = 300; // 5 phút = 300 giây
                countdownSpan.innerText = "05:00";

                countdownInterval = setInterval(function() {
                    timeLeft--;
                    let m = Math.floor(timeLeft / 60);
                    let s = timeLeft % 60;
                    countdownSpan.innerText = (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;

                    if (timeLeft <= 0) {
                        clearInterval(countdownInterval);
                        protectionOverlay.style.display = 'none';
                        isLocked = false; // Hết giờ phạt thì mở khóa
                    }
                }, 1000);
            });
            // Bỏ đi sự kiện focus -> Click lại web cũng KHÔNG mở khóa được! Phải đợi 5 phút.
        }
    </script>
  </body>
