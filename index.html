  <body>
    <!-- Nơi React sẽ kết nối và vẽ giao diện vào -->
    <div id="root"></div>
    <script>
      // Chặn click chuột phải
      document.addEventListener('contextmenu', function(e) {
        e.preventDefault();
      });

      // Chặn các phím tắt (F12, Ctrl+U, Ctrl+Shift+I/J/C, Ctrl+S)
      document.onkeydown = function(e) {
        if (e.keyCode === 123) return false;
        if (e.ctrlKey && e.keyCode === 85) return false;
        if (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67)) return false;
        if (e.ctrlKey && e.keyCode === 83) return false;
      };
    </script>
    
    <!-- ANTI-SCREENSHOT PROTECTION -->
    <style>
      #mts-anti-screenshot { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.98); color: #fff; z-index: 9999999; justify-content: center; align-items: center; flex-direction: column; font-family: sans-serif; text-align: center; }
    </style>
    <div id="mts-anti-screenshot">
        <span style="font-size: 50px; margin-bottom: 20px;">⚠️</span>
        <b style="font-size: 24px;">MÀN HÌNH ĐÃ BỊ CHE</b>
        <p style="font-size: 16px; color: #ccc; margin-top: 10px;">Bạn phải Đăng Nhập để được phép xem nội dung này.<br>Hành động chụp màn hình / chuyển ứng dụng bị khóa.</p>
    </div>
    <script>
        const daDangNhap = false; // Tạm giả lập chưa đăng nhập
        if (!daDangNhap) {
            const protectionOverlay = document.getElementById('mts-anti-screenshot');
            window.addEventListener('blur', function() { protectionOverlay.style.display = 'flex'; });
            window.addEventListener('focus', function() { protectionOverlay.style.display = 'none'; });
        }
    </script>
  </body>
